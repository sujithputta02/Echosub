<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border-radius: 8px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      background: linear-gradient(to right, #60a5fa, #3b82f6);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 12px;
      color: #94a3b8;
    }
    .section {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .toggle-group:last-child {
      margin-bottom: 0;
    }
    .label {
      font-size: 14px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #3b82f6;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <div>
      <h1>EchoSub</h1>
      <div class="tagline">Understand every word.</div>
    </div>
  </div>

  <div class="section">
    <div class="toggle-group">
      <span class="label">Enhanced Subtitles</span>
      <label class="switch">
        <input type="checkbox" id="enableSubtitles" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-group">
      <span class="label">Simplified Mode</span>
      <label class="switch">
        <input type="checkbox" id="simplifiedMode">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="toggle-group">
      <span class="label">Performance Mode</span>
      <select id="perfMode" style="background: #1e293b; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 4px;">
        <option value="low">Low Power</option>
        <option value="balanced" selected>Balanced AI</option>
        <option value="high">High Context</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="toggle-group">
      <span class="label">Voice Overlay</span>
      <label class="switch">
        <input type="checkbox" id="enableVoice">
        <span class="slider"></span>
      </label>
    </div>
    <div style="margin-top: 10px;">
      <span class="label" style="font-size: 11px;">Subtitles Size</span>
      <input type="range" id="subSize" min="0.5" max="2" step="0.1" value="1.0" style="width: 100%;">
    </div>
    <div style="margin-top: 10px;">
      <span class="label" style="font-size: 11px;">Voice Language</span>
      <select id="voiceLanguage" style="width: 100%; background: #1e293b; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 4px; margin-top: 4px;">
        <optgroup label="Indian">
          <option value="en-US">English (US)</option>
          <option value="hi-IN">Hindi (हिंदी)</option>
          <option value="te-IN">Telugu (తెలుగు)</option>
          <option value="ta-IN">Tamil (தமிழ்)</option>
          <option value="ml-IN">Malayalam (മലയാളം)</option>
        </optgroup>
        <optgroup label="International">
          <option value="es-ES">Spanish (Español)</option>
          <option value="fr-FR">French (Français)</option>
          <option value="ja-JP">Japanese (日本語)</option>
          <option value="de-DE">German (Deutsch)</option>
          <option value="ar-SA">Arabic (العربية)</option>
          <option value="ko-KR">Korean (한국어)</option>
        </optgroup>
      </select>
    </div>
    <div style="margin-top: 10px;">
      <span class="label" style="font-size: 11px;">Voice Volume</span>
      <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="0.5" style="width: 100%;">
    </div>
  </div>

  <div class="footer">
    EchoSub v1.0.0 • Premium Local AI
  </div>

  <script src="popup.js"></script>
</body>
</html>
